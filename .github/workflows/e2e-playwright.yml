name: Playwright E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and deps
        uses: microsoft/playwright-github-action@v1
        with:
          install-deps: true
          browsers: "chromium,firefox,webkit"

      - name: Start Expo web (port 8081)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx expo start --web --no-interactive --port 8081 &

      - name: Wait for web (8081)
        run: npx --no-install wait-on http://localhost:8081

      - name: Run Playwright tests
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8081
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run test:e2e:ci --silent

