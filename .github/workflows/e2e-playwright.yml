name: Playwright E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and deps
        uses: microsoft/playwright-github-action@v1
        with:
          install-deps: true
          browsers: "chromium,firefox,webkit"

      - name: Start Expo web (port 8081)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting Expo web on port 8081 (logs -> expo.log)"
          npx expo start --web --non-interactive --port 8081 > expo.log 2>&1 &
          sleep 1

      - name: Wait for web (8081)
        run: |
          echo "Waiting for http://localhost:8081 (timeout 120s)"
          npx --no-install wait-on http://localhost:8081 --timeout 120000 || (
            echo "Expo web did not start within timeout; dumping expo.log" &&
            tail -n 200 expo.log || true &&
            exit 1
          )

      - name: Run Playwright tests
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8081
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run test:e2e:ci --silent

